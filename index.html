<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTC EMA PRO V6</title><style>body{background:#101827;color:#e7edf7;font:16px system-ui;margin:20px}select,button{padding:10px;background:#26354a;color:white;border:1px solid #65758a;border-radius:6px}canvas{width:100%;height:340px;background:#172234}pre{white-space:pre-wrap}section{padding:15px;background:#172234;margin:12px 0;border-radius:8px}</style></head><body><h1>BTC EMA PRO V6</h1><a style="color:#9dcaff" href="../">Existing mobile push settings</a><p><select id="market"></select> <select id="tf"></select> <button id="refresh">Refresh</button> <button id="sound">Enable sound</button></p><p id="status"></p><canvas id="chart" width="1000" height="340"></canvas><p>EMA 9 (yellow) · <span style="color:#00ff00">EMA 21</span> · EMA 50 (blue) · EMA 200 (purple)</p><section id="metrics"></section><section><h2>Alert history</h2><pre id="history"></pre></section><script src="engine.js"></script><script>
const $=id=>document.getElementById(id);for(const m of Engine.markets)$('market').add(new Option(m,m));for(const t of Object.keys(Engine.frames))$('tf').add(new Option(t,t));$('tf').value='5m';let audio,last, busy=false;$('sound').onclick=()=>{audio=new AudioContext();audio.resume();};function beep(){if(!audio)return;const o=audio.createOscillator();o.connect(audio.destination);o.start();o.stop(audio.currentTime+.2);}function draw(a){const g=$('chart').getContext('2d'),r=a.chart,lo=Math.min(...r.flatMap(x=>[x.low,...Object.values(x.ema)])),hi=Math.max(...r.flatMap(x=>[x.high,...Object.values(x.ema)])),y=v=>320-(v-lo)/(hi-lo||1)*300;g.clearRect(0,0,1000,340);r.forEach((x,i)=>{g.strokeStyle=g.fillStyle=x.close>=x.open?'#36d399':'#ff647c';g.beginPath();g.moveTo(i*10+5,y(x.high));g.lineTo(i*10+5,y(x.low));g.stroke();g.fillRect(i*10+2,Math.min(y(x.open),y(x.close)),6,Math.max(1,Math.abs(y(x.open)-y(x.close))));});for(const [n,color] of [[9,'#ffd54a'],[21,'#00FF00'],[50,'#62aaff'],[200,'#c084fc']]){g.strokeStyle=color;g.beginPath();r.forEach((x,i)=>i?g.lineTo(i*10+5,y(x.ema[n])):g.moveTo(5,y(x.ema[n])));g.stroke();}}
async function refresh(){if(busy)return;busy=true;const m=$('market').value,t=$('tf').value;$('status').textContent='Loading '+m+' '+t;try{const trend=Engine.analyze(await Engine.candles(m,'15m'),'15m',0).trend,a=Engine.analyze(await Engine.candles(m,t),t,trend);draw(a);const f=x=>Number.isFinite(x)?x.toFixed(2):'N/A';$('metrics').textContent=`Price $${f(a.price)} | EMA ${Object.entries(a.ema).map(([k,v])=>k+': '+f(v)).join(' / ')} | WMA12 ${f(a.w12)} | WMA144 ${f(a.w144)} | VWAP ${f(a.vwap)} | RSI ${f(a.rsi)} | ADX ${f(a.adx)} | ATR ${f(a.atr)} | Volume ${f(a.volume)} / MA20 ${f(a.volumeMA)} | Signal ${a.signalDir===1?'BUY':a.signalDir===-1?'SELL':'WAIT'} ${a.orb}`;$('status').textContent='Closed candle: '+new Date((a.time+Engine.frames[t])*1000).toLocaleString();}catch(e){$('status').textContent='Live data unavailable: '+e.message;}try{const r=await fetch('state.json',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json(),p=s.items[m+' '+t]?.position;if(p)$('metrics').textContent+=' | Entry '+p.entry+' | SL '+p.stop+' | Targets '+p.targets.join(' / ');$('history').textContent=s.history.map(h=>new Date(h.time*1000).toLocaleString()+' '+h.body+' '+h.events.join(', ')).join('\n\n');const id=JSON.stringify(s.history[0]);if(last&&id!==last)beep();last=id;}catch{$('history').textContent='No published monitor state yet.';}busy=false;}$('refresh').onclick=refresh;$('market').onchange=refresh;$('tf').onchange=refresh;refresh();setInterval(refresh,60000);
</script></body></html>
