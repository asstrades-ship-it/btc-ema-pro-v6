<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>BTC EMA PRO V6</title><style>body{background:#ffffff;color:#172033;font:16px system-ui;margin:20px}select,button{padding:10px;background:#f8fafc;color:#172033;border:1px solid #94a3b8;border-radius:6px}canvas{width:100%;height:340px;background:#ffffff;border:1px solid #e2e8f0}pre{white-space:pre-wrap}section{padding:15px;background:#ffffff;border:1px solid #e2e8f0;margin:12px 0;border-radius:8px}</style></head><body><h1>BTC EMA PRO V6</h1><a style="color:#0759a8" href="push.html">Mobile push settings</a><p><select id="market"></select> <select id="tf"></select> <button id="refresh">Refresh</button> <button id="sound">Enable sound</button></p><p id="status"></p><canvas id="chart" width="1000" height="340"></canvas><p><span style="border-bottom:3px solid #EAB308;color:#172033">EMA 9</span> · <span style="border-bottom:3px solid #00FF00;color:#172033">EMA 21</span> · <span style="border-bottom:3px solid #008000;color:#172033">EMA 50</span> · <span style="border-bottom:3px solid #FF00FF;color:#172033">EMA 200</span> · <span style="border-bottom:3px solid #000000;color:#172033">WMA 12</span> · <span style="border-bottom:3px solid #00FFFF;color:#172033">WMA 144</span> · <span style="border-bottom:3px solid #6A6AFF;color:#172033">VWAP</span></p><h3>Volume / MA 20</h3><canvas id="volume" width="1000" height="150" style="height:150px"></canvas><p>Blue / red volume bars · Orange MA 20</p><section id="metrics"></section><section><h2>Alert history</h2><pre id="history"></pre></section><script src="engine.js"></script><script>
const $=id=>document.getElementById(id);for(const m of Engine.markets)$('market').add(new Option(m,m));for(const t of Object.keys(Engine.frames))$('tf').add(new Option(t,t));$('tf').value='5m';let audio,last, busy=false;$('sound').onclick=()=>{audio=new AudioContext();audio.resume();};function beep(){if(!audio)return;const o=audio.createOscillator();o.connect(audio.destination);o.start();o.stop(audio.currentTime+.2);}function draw(a){const g=$('chart').getContext('2d'),r=a.chart,series=[[x=>x.ema[9],'#EAB308'],[x=>x.ema[21],'#00FF00'],[x=>x.ema[50],'#008000'],[x=>x.ema[200],'#FF00FF'],[x=>x.w12,'#000000'],[x=>x.w144,'#00FFFF'],[x=>x.vwap,'#6A6AFF']],values=r.flatMap(x=>[x.low,x.high,...series.map(([get])=>get(x))]).filter(Number.isFinite),lo=Math.min(...values),hi=Math.max(...values),y=v=>320-(v-lo)/(hi-lo||1)*300;g.clearRect(0,0,1000,340);r.forEach((x,i)=>{g.strokeStyle=g.fillStyle=x.close>=x.open?'#0000FF':'#FF0000';g.beginPath();g.moveTo(i*10+5,y(x.high));g.lineTo(i*10+5,y(x.low));g.stroke();g.fillRect(i*10+2,Math.min(y(x.open),y(x.close)),6,Math.max(1,Math.abs(y(x.open)-y(x.close))));});for(const [get,color] of series){g.strokeStyle=color;g.lineWidth=1.5;g.beginPath();let active=false;r.forEach((x,i)=>{const v=get(x);if(!Number.isFinite(v)){active=false;return;}if(active)g.lineTo(i*10+5,y(v));else g.moveTo(i*10+5,y(v));active=true;});g.stroke();}g.lineWidth=1;}
function drawVolume(a){const g=$('volume').getContext('2d'),r=a.chart,max=Math.max(1,...r.flatMap(x=>[x.volume,x.volumeMA]).filter(Number.isFinite));g.clearRect(0,0,1000,150);r.forEach((x,i)=>{g.fillStyle=x.close>=x.open?'#0000FF':'#FF0000';const h=x.volume/max*135;g.fillRect(i*10+2,145-h,6,h);});g.strokeStyle='#FF9800';g.lineWidth=2;g.beginPath();r.forEach((x,i)=>{const y=145-x.volumeMA/max*135;if(i)g.lineTo(i*10+5,y);else g.moveTo(i*10+5,y);});g.stroke();}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);
async function refresh(){if(busy)return;busy=true;const m=$('market').value,t=$('tf').value;$('status').textContent='Loading '+m+' '+t;try{const trend=Engine.analyze(await Engine.candles(m,'15m'),'15m',0).trend,a=Engine.analyze(await Engine.candles(m,t),t,trend);draw(a);drawVolume(a);const f=x=>Number.isFinite(x)?x.toFixed(2):'N/A';$('metrics').textContent=`Price $${f(a.price)} | EMA ${Object.entries(a.ema).map(([k,v])=>k+': '+f(v)).join(' / ')} | WMA12 ${f(a.w12)} | WMA144 ${f(a.w144)} | VWAP ${f(a.vwap)} | RSI ${f(a.rsi)} | ADX ${f(a.adx)} | ATR ${f(a.atr)} | Volume ${f(a.volume)} / MA20 ${f(a.volumeMA)} | Signal ${a.signalDir===1?'BUY':a.signalDir===-1?'SELL':'WAIT'} ${a.orb} | ORB high ${f(a.orbHigh)} / low ${f(a.orbLow)}`;$('status').textContent='Closed candle: '+new Date((a.time+Engine.frames[t])*1000).toLocaleString();}catch(e){$('status').textContent='Live data unavailable: '+e.message;}try{const r=await fetch('state.json',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json(),p=s.items[m+' '+t]?.position;if(p)$('metrics').textContent+=' | Entry '+p.entry+' | SL '+p.stop+' | Targets '+p.targets.join(' / ');$('history').textContent=s.history.map(h=>new Date(h.time*1000).toLocaleString()+' '+h.body+' '+h.events.join(', ')).join('\n\n');const id=JSON.stringify(s.history[0]);if(last&&id!==last)beep();last=id;}catch{$('history').textContent='No published monitor state yet.';}busy=false;}$('refresh').onclick=refresh;$('market').onchange=refresh;$('tf').onchange=refresh;refresh();setInterval(refresh,60000);
</script></body></html>
