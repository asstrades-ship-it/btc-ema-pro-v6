
name: BTC EMA PRO V6.1 Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v61-notification-test
  cancel-in-progress: false

jobs:
  notification-test:
    if: github.ref == 'refs/heads/v6.1-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Web Push
        run: npm install --no-save --package-lock=false web-push@3.6.7

      - name: Check monitor syntax
        run: node --check monitor.js

      - name: Test Telegram and Mobile Push
        run: node monitor.js
        env:
          SEND_ALERTS: 'true'
          NOTIFICATION_TEST: 'true'
          STATE_FILE: state-notification-test.json
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Verify notification delivery
        run: |
          node -e "const s=require('./state-notification-test.json').notificationTest; console.log(s); if(!s.success || !s.delivery.telegram || !s.delivery.push) process.exit(1);"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v61-notification-test-results
          path: state-notification-test.json
