
name: BTC EMA PRO V6.1 Isolated Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-test:
    if: github.ref == 'refs/heads/v6.1-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-save --package-lock=false web-push@3.6.7

      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check levels.js
          node --check monitor.js
          node --check test-stage93.js

      - name: Run offline strategy tests
        run: node test-stage93.js

      - name: Run isolated monitor
        run: node monitor.js
        env:
          SEND_ALERTS: 'false'
          DRY_RUN_SAVE: 'true'
          STATE_FILE: state-test.json
          SIGNAL_MODE: both

      - name: Verify test results
        run: |
          node -e "const s=require('./state-test.json'); console.log('Last Run:',s.lastRun); console.log('Dry Run:',s.dryRun); console.log('Markets:',Object.keys(s.items||{})); console.log('Errors:',s.errors); console.log('Alerts:',(s.history||[]).length); if(s.dryRun!==true || !Array.isArray(s.errors) || s.errors.length || !Object.keys(s.items||{}).length) process.exit(1);"

      - uses: actions/upload-artifact@v5
        with:
          name: v6-1-test-state
          path: state-test.json
