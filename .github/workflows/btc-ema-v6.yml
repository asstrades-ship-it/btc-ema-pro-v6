
name: BTC EMA PRO V6.1 Isolated Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v61-isolated-test
  cancel-in-progress: false

jobs:
  monitor-test:
    if: github.ref == 'refs/heads/v6.1-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-save --package-lock=false web-push@3.6.7

      - name: Check JavaScript syntax
        run: |
          node --check engine.js
          node --check levels.js
          node --check monitor.js
          node --check test-stage93.js
          node --check test-reliability.js
          node --check migrate-state.js

      - name: Run offline strategy tests
        run: node test-stage93.js

      - name: Run advanced reliability tests
        run: node test-reliability.js

      - name: Fetch latest production state
        run: |
          git fetch origin main
          git show FETCH_HEAD:state.json > state-production-copy.json

      - name: Test production state migration
        run: |
          node migrate-state.js state-production-copy.json state-v61-migrated.json

      - name: Verify migrated state
        run: |
          node -e "const a=require('./state-production-copy.json'); const b=require('./state-v61-migrated.json'); const assert=require('node:assert/strict'); assert.equal(b.stateVersion,'6.1'); assert.equal(b.dryRun,false); assert.deepEqual(a.history,b.history); assert.deepEqual(Object.keys(a.items),Object.keys(b.items)); for(const k of Object.keys(a.items)){const p=a.items[k].position; if(p){assert.deepEqual({...p,hit:p.hit||[]},b.items[k].position);}else{assert.equal(b.items[k].position,p);}} assert.equal(Object.keys(b.outbox).length,0); console.log('PRODUCTION STATE MIGRATION VERIFIED');"

      - name: Run isolated monitor
        run: node monitor.js
        env:
          SEND_ALERTS: 'false'
          DRY_RUN_SAVE: 'true'
          STATE_FILE: state-test.json
          SIGNAL_MODE: both

      - name: Verify monitor results
        run: |
          node -e "const s=require('./state-test.json'); console.log('Last Run:',s.lastRun); console.log('Dry Run:',s.dryRun); console.log('Markets:',Object.keys(s.items||{})); console.log('Errors:',s.errors); if(s.dryRun!==true || !Array.isArray(s.errors) || s.errors.length || !Object.keys(s.items||{}).length) process.exit(1);"

      - name: Upload migration test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: v61-migration-test-results
          path: |
            state-production-copy.json
            state-production-copy.json.v6-backup-*
            state-v61-migrated.json
            state-test.json
